<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      try {
        const account = JSON.parse(localStorage.getItem('no_offside_appearance_account') || '"anonymous"');
        const appearance = JSON.parse(localStorage.getItem('no_offside_appearance_' + account) || '{}');
        const dark = appearance.theme === 'dark' || ((!appearance.theme || appearance.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.font = appearance.fontFamily === 'Be Vietnam Pro' ? 'vietnam' : 'system';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f172a' : '#f8fafc';
      } catch {}
    </script>

    <!-- Dành riêng cho iPhone/iPad (iOS) để icon hiển thị mượt mà -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png">

    <!-- Thanh trạng thái trên đỉnh iPhone (màu trong suốt hoặc trùng màu nền app) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="No Offside">

    <!-- Favicon chuẩn cho trình duyệt -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Font: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>No Offside — Quản Lý Đội Bóng</title>
  </head>
  <body class="bg-slate-50 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
